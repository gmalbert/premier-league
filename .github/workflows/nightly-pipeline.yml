name: Premier League artifact pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: write

concurrency:
  group: premier-league-artifact-pipeline
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  CORE_REF: "v1.3.1"
  PITCH_ORACLE_LEAGUE: "epl"
  PITCH_ORACLE_DATA_DIR: "data_files"
  PITCH_ORACLE_MODELS_DIR: "models"

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install the pinned consumer runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m pip install "pitch-oracle-core[consumer] @ git+https://github.com/gmalbert/pitch-oracle-core.git@${CORE_REF}"
          python -m pip check

      - name: Fetch and prepare league data
        run: |
          python -m combine_raw_data
          python -m fetch_upcoming_fixtures
          python -c "from config import LEAGUE_CONFIG; from fetch_clubelo import main; main(LEAGUE_CONFIG)"
          python -c "from config import LEAGUE_CONFIG; from fetch_understat_xg import main; main(LEAGUE_CONFIG)"
          python -m prepare_model_data

      - name: Train models chronologically
        run: python -m train_models

      - name: Build strict runtime artifacts
        run: |
          python -m precompute_database
          python -m precompute_model_diagnostics
          python scripts/precompute_predictions.py
          python -m build_cache_manifest

      - name: Validate prediction history
        run: python -c "from track_predictions import validate_predictions; validate_predictions()"

      - name: Export best bets
        run: python scripts/export_best_bets.py

      - name: Run consumer verification
        run: |
          python -m pytest -q
          python scripts/verify_parity.py

      - name: Commit one coherent artifact set
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add data_files models precomputed
          if git diff --staged --quiet; then
            echo "No artifact changes to commit"
            exit 0
          fi
          git commit -m "chore: refresh EPL runtime artifacts"
          git pull --rebase origin main
          git push origin main
