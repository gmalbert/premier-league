name: Nightly Data & Model Pipeline
# Fresh workflow file to avoid caching issues
on:
  schedule:
    - cron: '0 7 * * *'  # 2 AM ET (7 AM UTC) daily
  workflow_dispatch:  # Allow manual triggering

  workflow_call:
    inputs:
      core_ref:
        required: false
        type: string
        default: "v1.1.0"

permissions:
  contents: write  # Allow the workflow to commit and push changes

jobs:
  check-matches:
    runs-on: ubuntu-latest
    outputs:
      has-matches: ${{ steps.check.outputs.has-matches }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
          python -m pip install "pitch-oracle-core @ git+https://github.com/gmalbert/pitch-oracle-core.git@${{ inputs.core_ref || 'v1.1.0' }}"

      - name: Fetch upcoming fixtures
        run: python -m fetch_upcoming_fixtures

      - name: Check for tomorrow's matches
        id: check
        run: |
          if python -m check_tomorrow_matches; then
            echo "has-matches=true" >> $GITHUB_OUTPUT
            echo "Matches found for tomorrow - proceeding with data update"
          else
            echo "has-matches=false" >> $GITHUB_OUTPUT
            echo "No matches tomorrow - skipping data update"
          fi

  update-data:
    needs: check-matches
    if: needs.check-matches.outputs.has-matches == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60  # 1 hour total job timeout

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
      - name: Fetch upcoming fixtures
        run: python -m fetch_upcoming_fixtures

      - name: Run tests
        run: |
          echo "Running basic tests..."
          # use module invocation to ensure pytest is available
          python -m pytest tests/test_poisson_evaluation.py

      - name: Run data pipeline
        timeout-minutes: 30  # 30 minutes for data processing (includes weather/injury API calls)
        run: |
          echo "Running data pipeline..."
          python -m combine_raw_data
          python -m prepare_model_data

      - name: Train ML models
        timeout-minutes: 30  # 30 minutes for model training
        run: |
          echo "Training ML models..."
          python -m train_models

      - name: Validate models
        run: |
          echo "Validating trained models..."
          python -m validate_models
      - name: Evaluate Poisson metrics
        run: |
          echo "Running Poisson evaluation script..."
          python -m evaluate_poisson
      - name: Validate data
        run: |
          echo "Validating updated data..."
          python -c "
          import pandas as pd
          import os
          csv_path = 'data_files/combined_historical_data_with_calculations.csv'
          if os.path.exists(csv_path):
              df = pd.read_csv(csv_path, sep='\t')
              print(f'Data validation passed: {len(df)} rows')
              if len(df) < 1000:
                  raise ValueError('Data validation failed: insufficient rows')
          else:
              raise FileNotFoundError('Data file not found after pipeline')
          "

      - name: Precompute runtime data
        run: python -m precompute_database

      - name: Precompute upcoming predictions
        run: python scripts/precompute_predictions.py

      - name: Build and validate runtime cache manifest
        run: python -m build_cache_manifest

      - name: Commit and push changes
        run: |
          echo "Checking for changes..."
          git config --local user.email 'action@github.com'
          git config --local user.name 'GitHub Action'

          # Check if there are changes
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit"
          else
            echo "Committing data and model updates..."
            git add data_files/
            git add models/ precomputed/
            git commit -m "Nightly update - $(date +'%Y-%m-%d') - Data + Models" || echo "No changes to commit"
            
            # Pull any remote changes and push in a loop with retries
            echo "Pushing changes with retry logic..."
            for i in {1..5}; do
              if git pull --rebase origin main && git push origin main; then
                echo "Successfully pushed changes"
                break
              else
                echo "Push failed, retrying in 5 seconds... (attempt $i/5)"
                sleep 5
              fi
            done
          fi

      - name: Export best bets for Sports Picks Grid
        run: python scripts/export_best_bets.py
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Commit best_bets_today.json
        run: |
          git add data_files/best_bets_today.json
          git diff --staged --quiet || git commit -m "chore: update best_bets_today [skip ci]"
          git push origin main
        continue-on-error: true

      - name: Notification on failure
        if: failure()
        run: |
          echo "Data pipeline failed - check logs for details"
          # Could add Slack/email notifications here in the future

  validate-predictions:
    needs: update-data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Validate predictions
        run: |
          echo "Validating prediction accuracy..."
          python -c "
          from track_predictions import validate_predictions
          import pandas as pd
          
          # Run validation
          perf = validate_predictions()
          
          if perf is not None and len(perf) > 0:
              completed = perf[perf['Correct'].notna()]
              if len(completed) > 0:
                  accuracy = completed['Correct'].mean()
                  print(f'✅ Prediction validation completed: {accuracy:.1%} accuracy ({len(completed)} predictions)')
              else:
                  print('ℹ️  No predictions ready for validation yet')
          else:
              print('ℹ️  No prediction history found')
          "

      - name: Commit prediction validation updates
        run: |
          echo "Checking for prediction log changes..."
          git config --local user.email 'action@github.com'
          git config --local user.name 'GitHub Action'

          # Check if predictions log has changes
          if git diff --quiet data_files/predictions_log.csv 2>/dev/null; then
            echo "No prediction validation updates to commit"
          else
            echo "Committing prediction validation updates..."
            git add data_files/predictions_log.csv
            git commit -m "Prediction validation update - $(date +'%Y-%m-%d')" || echo "No changes to commit"
            
            # Pull any remote changes and push in a loop with retries
            echo "Pushing changes with retry logic..."
            for i in {1..5}; do
              if git pull --rebase origin main && git push origin main; then
                echo "Successfully pushed changes"
                break
              else
                echo "Push failed, retrying in 5 seconds... (attempt $i/5)"
                sleep 5
              fi
            done
          fi
